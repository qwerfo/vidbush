[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vidbush"
version = "0.1.0"
description = "Self-hosted long-form faceless YouTube video production"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.13.5",
  "PyYAML==6.0.3",
  "numpy==2.5.3; python_version >= \"3.12\"",
  "numpy==2.4.6; python_version < \"3.12\"",  # numpy 2.5 dropped 3.11
  "pillow==12.3.0",
  "requests==2.34.2",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "sqlmodel==0.0.48",
  "python-multipart",
  "jsonschema",
  "yt-dlp[default]==2026.10.26",  # default extra brings yt-dlp-ejs (YouTube challenge solver)
  "scenedetect==0.7.2",
  "opencv-python-headless",
]

[project.optional-dependencies]
whisper = ["faster-whisper==1.2.1"]
dev = ["pytest==9.2.0", "httpx"]

[project.scripts]
vidbush = "vidbush.cli:main"

[tool.setuptools.packages.find]
include = ["vidbush*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: renders video (integration)"]
