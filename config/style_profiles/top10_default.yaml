id: top10_default
name: Top 10 default
palette: top10_bold
# Share of shot count. full_screen_cards are motion_graphic shots; animated_overlays (maps, charts,
# callouts, arrows, lower thirds) ride on top of footage and image shots and add to their overlay share.
visual_mix: {footage: 20, footage_overlay: 21, image: 7, image_overlay: 10, full_screen_cards: 20,
             animated_overlays: 22, ai_image: 0, ai_video: 0}
pacing:
  footage: {min: 3, max: 7, mean: 4.8}
  footage_overlay: {min: 3, max: 7, mean: 5.0}
  image: {min: 4, max: 8, mean: 5.5}
  image_overlay: {min: 4, max: 8, mean: 5.8}
  ai_image: {min: 4, max: 8, mean: 5.5}
  ai_video: {min: 3, max: 6, mean: 4.5}
  motion_graphic: {min: 6, max: 15, mean: 8.5}
  hook_seconds: 60
  hook_multiplier: 0.7
  jitter: 0.25
  card_spacing_s: 45  # at most one full screen card per 45 s outside the hook and recap
  card_hold_max: 4  # seconds a static title, text, quote or number card holds; the rest is footage
captions: {enabled: true, font: Inter, weight: ExtraBold, size: 64, color: "#FFFFFF", outline_color: "#000000",
           outline: 4, shadow: 0, highlight_color: "#FFD84A", uppercase: false, min_words: 3, max_words: 5,
           position: bottom_band, band_height: 0.5}
letterbox: {enabled: true, ratio: 2.39}
transitions: {cut_probability: 0.9, crossfade_duration: 0.4}
colour: {lut_path: null}
music: {ducking_depth_db: 12, attack_ms: 80, release_ms: 600, bed_gain_db: -18, scene_crossfade_s: 1.5}
motion: {ken_burns_intensity: 0.12, depthflow: false}
top10: true
