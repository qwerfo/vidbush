# Vidbush application settings. Keys and URLs live in .env, never here.
output_folder: output
data_folder: data
source_cache_folder: data/source_cache
music_folder: fixtures/music
offline: false          # true = never touch the network, every seat runs mock
allow_mock_fallback: false  # true = if every real provider for a role fails, use mock instead of failing the stage

sources:
  # order is the search order; disabled sources are skipped
  enabled: [local, youtube, wikimedia, archive, loc, nasa, pexels, pixabay]
  allow_youtube: true
  flag_nc_nd: true      # CC NC / ND assets are allowed but flagged in qa_report
  blocklist: []         # domains never used, e.g. [example.com, badstock.net]
  max_candidates: 8
  youtube_max_height: 1080
  youtube_min_height: 720
  local_library: fixtures/sample_assets   # your own footage folder, see docs/HANDOFF.md
  timeout_s: 20
  flag_standard_youtube: true      # Standard YouTube Licence clips are allowed but flagged in qa_report
  youtube_cookies_from_browser: "" # e.g. firefox or "chrome:Profile 1"; passed to yt-dlp when set
  youtube_cookie_file: ""          # path to a Netscape cookies.txt; passed to yt-dlp when set
  youtube_download_workers: 3      # parallel downloads of different videos; searches stay serial
  youtube_windows: 3               # windows sampled across a video when no transcript or chapter matches

judge:
  threshold: 70
  max_attempts: 3
  post_render_every_s: 3
  first_keyframe_detail: high   # image detail for the first keyframe of each candidate (high | low | auto)
  keyframe_detail: low          # the other keyframes; post-render QA is always low
  prefilter:                    # local checks before the vision judge, see docs/HANDOFF.md
    enabled: true
    text: true                  # burned-in subtitles and lower-third text (OCR)
    logo: true                  # static corner logo or watermark
    face: true                  # large frontal face to camera (talking head)

cost:
  image_ceiling_usd: 0.05
  image_warn_usd: 0.03
  llm_per_1k_tokens_usd: 0.002   # estimate used only when a provider returns no cost
  vision_per_image_usd: 0.002       # one low detail image
  vision_per_image_high_usd: 0.010  # one high detail 640 px keyframe (2 tiles, about 5x low)
  tts_per_1k_chars_usd: 0.18
  image_per_image_usd: 0.02
  video_per_second_usd: 0.05

render:
  renderer: python      # python (built in) or remotion (needs node + chromium, see renderer/README.md)
  preset: veryfast
  crf: 20
  workers: 3
  width: 1920
  height: 1080
  fps: 30
  target_lufs: -14
  true_peak: -1
  narration_lufs: -16

batch:
  cost_cap_usd: 5.0     # a batch run stops a project (needs_review) once it spent more; null = no cap, see docs/HANDOFF.md
